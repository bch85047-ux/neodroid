name: NeoDroid
options:
  bundleIdPrefix: dev.neodroid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_BITCODE: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  NeoDroid:
    type: application
    platform: iOS
    sources:
      - path: ios
        excludes:
          - "Info.plist"
          - "NeoDroid.entitlements"
      - path: runtime/src
      - path: runtime/include
    settings:
      base:
        INFOPLIST_FILE: ios/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.neodroid.app
        PRODUCT_NAME: NeoDroid
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: ios/NeoDroid-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/runtime/include"
        CODE_SIGN_STYLE: Manual

schemes:
  NeoDroid:
    build:
      targets:
        NeoDroid: all
    run:
      config: Debug
    archive:
      config: Release