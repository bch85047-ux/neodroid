name: ART Build (Alpine musl ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - name: Build inside Alpine container
        run: |
          mkdir -p "$PWD/out"
          cat > "$PWD/build.sh" <<'EOS'
          #!/bin/sh
          set -eux
          apk update
          apk add --no-cache build-base git python3 py3-setuptools py3-pip \
            openjdk17-jdk zip unzip bash perl linux-headers pkgconf meson \
            libbsd-dev libunwind-dev elfutils-dev icu-dev openssl-dev \
            expat-dev lz4-dev xz-dev libcap-dev \
            libpng-dev libjpeg-turbo-dev libwebp-dev zlib-dev libzip-dev \
            tinyxml2-dev protobuf-dev pcre2 autoconf automake libtool wget

          echo "=== wolfssl from source (OPENSSL_EXTRA, no COEXIST) ==="
          cd /tmp
          wget -q https://github.com/wolfSSL/wolfssl/archive/refs/tags/v5.7.4-stable.tar.gz -O wolfssl.tar.gz
          tar xf wolfssl.tar.gz
          cd wolfssl-5.7.4-stable
          ./autogen.sh > /dev/null 2>&1 || autoreconf -fi
          test -x ./configure || { echo "FATAL: no configure"; exit 1; }
          ./configure --prefix=/usr/local --enable-shared --enable-opensslall \
            --enable-jni --enable-crl --enable-base64encode --enable-aesgcm \
            --enable-sha512 --enable-ecc --disable-examples --disable-crypttests 2>&1 | tail -5
          make -j$(nproc) > /dev/null 2>&1
          make install
          ls -la /usr/local/lib/libwolfssl.so* 2>/dev/null | head -3
          grep -c 'OPENSSL_COEXIST' /usr/local/include/wolfssl/wolfcrypt/settings.h || echo "no COEXIST (good)"

          echo "=== VIXL ==="
          git clone --depth=1 https://android.googlesource.com/platform/external/vixl /vixl
          cd /vixl/src
          SRC=$(ls *.cc aarch64/*.cc aarch32/*.cc 2>/dev/null)
          echo "vixl srcs: $(echo "$SRC" | wc -l)"
          g++ -shared -fPIC -O1 -std=gnu++17 \
            -DVIXL_INCLUDE_TARGET_AARCH64 -DVIXL_INCLUDE_TARGET_AARCH32 \
            -DVIXL_CODE_BUFFER_MMAP -I. -I.. $SRC -o /usr/local/lib/libvixl.so
          ln -sf /usr/local/lib/libvixl.so /usr/lib/libvixl.so

          echo "=== bionic_translation ==="
          git clone --depth=1 https://gitlab.com/android_translation_layer/bionic_translation.git /bt
          cd /bt
          meson setup build --prefix=/usr/local
          meson compile -C build
          meson install -C build
          echo "--- collect all bionic_translation libs ---"
          find /bt -name '*.so*' -type f | head -40
          find /bt -name '*.so*' -type f -exec cp -P {} /usr/local/lib/ \; 2>/dev/null || true
          find /bt -name '*.so*' -type l -exec cp -P {} /usr/local/lib/ \; 2>/dev/null || true
          ls -la /usr/local/lib/ | grep -E 'dl_bio|libdl' | head
          echo /usr/local/lib >> /etc/ld-musl-aarch64.path
          cat /etc/ld-musl-aarch64.path

          echo "=== art_standalone ==="
          git clone --depth=1 https://gitlab.com/android_translation_layer/art_standalone.git /art
          git clone --depth=1 https://android.googlesource.com/platform/external/vixl /art/external/vixl
          cd /art
          F=system/core/liblog/fake_log_device.c
          grep -q 'stdbool.h' "$F" || sed -i '/#include <fcntl.h>/a #include <stdbool.h>' "$F"
          perl -0pi -e 's/    if \(char \*liblog_color = getenv\("LIBLOG_COLOR"\)\) \{/    const char *liblog_color = getenv("LIBLOG_COLOR");\n    if (liblog_color != NULL) {/' "$F"
          git ls-files -s | awk '$1==120000 {print $4}' | while read f; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then
              tgt=$(cat "$f"); d=$(dirname "$f"); real="$d/$tgt"
              if [ -f "$real" ]; then cp -f "$real" "$f"; elif [ -d "$real" ]; then rm -f "$f"; cp -r "$real" "$f"; fi
            fi
          done

          echo "=== make ==="
          set -o pipefail || true
          make -j$(nproc) 2>&1 | tee /art/build.log || true

          echo "=== collect ==="
          mkdir -p /w/out
          cp -a /art/out/host/linux-x86/*.so /w/out/ 2>/dev/null || true
          cp -a /art/out/host/linux-x86/bin /w/out/ 2>/dev/null || true
          cp /art/build.log /w/out/ 2>/dev/null || true
          du -sh /w/out || true
          ls -la /w/out | head -30 || true
          EOS
          chmod +x "$PWD/build.sh"
          docker run --rm -v "$PWD:/w" -w /w alpine:3.21 /w/build.sh
          echo "=== host out ==="
          ls -la "$PWD/out" | head -30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-musl-arm64
          path: out
          retention-days: 14
          if-no-files-found: warn
