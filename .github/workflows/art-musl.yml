name: ART Build (Alpine musl ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    container: alpine:3.21
    steps:
      - name: Install deps
        run: |
          apk update
          apk add --no-cache build-base git python3 py3-pip py3-setuptools \
            openjdk17-jdk zip unzip bash perl linux-headers \
            libbsd-dev libunwind-dev elfutils-dev icu-dev openssl-dev \
            expat-dev lz4-dev xz-dev libcap-dev wolfssl-dev \
            libpng-dev libjpeg-turbo-dev libwebp-dev zlib-dev libzip-dev \
            tinyxml2-dev protobuf-dev meson pkgconf

      - name: Build VIXL
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/external/vixl /tmp/vixl
          cd /tmp/vixl/src
          SRC=$(ls *.cc aarch64/*.cc aarch32/*.cc 2>/dev/null)
          echo "vixl srcs: $(echo "$SRC" | wc -l)"
          g++ -shared -fPIC -O1 -std=gnu++17 \
            -DVIXL_INCLUDE_TARGET_AARCH64 -DVIXL_INCLUDE_TARGET_AARCH32 \
            -DVIXL_CODE_BUFFER_MMAP -I. -I.. $SRC -o /usr/local/lib/libvixl.so
          echo /usr/local/lib > /etc/ld-musl-aarch64.path
          ldconfig 2>/dev/null || true

      - name: Build bionic_translation
        run: |
          git clone --depth=1 https://gitlab.com/android_translation_layer/bionic_translation.git /tmp/bt
          cd /tmp/bt && meson setup build --prefix=/usr/local && meson install -C build
          ldconfig 2>/dev/null || true

      - name: Clone art_standalone
        run: |
          git clone --depth=1 https://gitlab.com/android_translation_layer/art_standalone.git /tmp/art
          git clone --depth=1 https://android.googlesource.com/platform/external/vixl /tmp/art/external/vixl

      - name: Patch GNU-isms
        run: |
          cd /tmp/art
          F=system/core/liblog/fake_log_device.c
          grep -q 'stdbool.h' "$F" || sed -i '/#include <fcntl.h>/a #include <stdbool.h>' "$F"
          perl -0pi -e 's/    if \(char \*liblog_color = getenv\("LIBLOG_COLOR"\)\) \{/    const char *liblog_color = getenv("LIBLOG_COLOR");\n    if (liblog_color != NULL) {/' "$F"
          sed -i 's/-DOPENSSL_EXTRA//g' external/wolfssljni/Android.mk
          git ls-files -s | awk '$1==120000 {print $4}' | while read f; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then
              tgt=$(cat "$f"); d=$(dirname "$f"); real="$d/$tgt"
              if [ -f "$real" ]; then cp -f "$real" "$f"; elif [ -d "$real" ]; then rm -f "$f"; cp -r "$real" "$f"; fi
            fi
          done

      - name: Build ART
        run: |
          set -o pipefail
          cd /tmp/art
          make -j$(nproc) 2>&1 | tee build.log

      - name: Collect
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -a /tmp/art/out/host/linux-x86/*.so /tmp/out/ 2>/dev/null || true
          cp -a /tmp/art/out/host/linux-x86/bin /tmp/out/ 2>/dev/null || true
          cp -a /tmp/art/out/host/linux-x86/gen /tmp/out/ 2>/dev/null || true
          cp /tmp/art/build.log /tmp/out/ 2>/dev/null || true
          du -sh /tmp/out; ls /tmp/out | head -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-musl-arm64
          path: /tmp/out
          retention-days: 14
